[project]
name = "erdos12-oracles"
version = "1.0.0"
description = "Python oracle verification suite for Erdős Problem #12 Part (iii)"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache-2.0"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_oracles.py"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python)
    "BLE",    # blind except
    "EXE",    # shebang
    "B",      # flake8-bugbear
]
ignore = [
    "F401",    # unused import — sometimes needed for re-export
    "E402",    # import after sys.path manipulation — required for standalone scripts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

